<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Online Store</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<header class="bar"><a class="logo" href="#" id="name"></a>
 <input id="q" type="search" aria-label="Search products" placeholder="Search products">
 <button id="cartbtn" class="cartbtn" aria-label="Open cart">Cart <b id="count">0</b></button></header>
<section class="hero"><h1 id="tag"></h1><p>Free shipping on orders above <b id="free"></b>. Order in a minute on WhatsApp.</p></section>
<main>
 <div class="tools"><div id="cats" class="cats" role="group" aria-label="Categories"></div>
  <label>Sort <select id="sort"><option value="">Featured</option><option value="lo">Price: low to high</option><option value="hi">Price: high to low</option><option value="rt">Top rated</option></select></label></div>
 <p id="res" class="mut" role="status"></p><div id="grid" class="grid"></div>
</main>
<footer><span id="foot"></span></footer>
<div id="modal" class="modal" hidden><div class="box" role="dialog" aria-modal="true" aria-label="Product details"><button class="x" id="mx" aria-label="Close">×</button><div id="mbody"></div></div></div>
<aside id="drawer" class="drawer" hidden aria-label="Cart"><div class="dh"><h2>Your cart</h2><button class="x" id="dx" aria-label="Close cart">×</button></div>
 <div id="items" class="items"></div>
 <div id="sum" class="sum"></div>
 <form id="co" class="co"><input id="cn" required placeholder="Full name" autocomplete="name"><input id="cp" required inputmode="tel" placeholder="Phone number" autocomplete="tel"><textarea id="ca" required placeholder="Delivery address" rows="2" autocomplete="street-address"></textarea>
  <button class="pri" type="submit">Order on WhatsApp</button><button type="button" id="em">Email order</button><p id="msg" class="mut" role="status"></p></form></aside>
<div id="veil" class="veil" hidden></div>
<script src="js/config.js"></script><script src="js/products.js"></script><script src="js/app.js"></script>
</body></html>
